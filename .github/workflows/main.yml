name: Telegram Session Bot 24/7
on:
  schedule:
    # Start a fresh runner every 5 hours.
    - cron: "0 */5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-session-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Stay below GitHub-hosted runner's maximum job duration.
    timeout-minutes: 290
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Telegram Session Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          FLOW_TIMEOUT_SECONDS: "600"
          RATE_LIMIT_MAX_STARTS: "3"
          RATE_LIMIT_WINDOW_SECONDS: "3600"
          MAX_AUTH_ATTEMPTS: "3"
          SECURE_TMP_DIR: "/tmp/telegram-session-generator"
          LOG_LEVEL: "INFO"
        run: |
          python -m src.main
